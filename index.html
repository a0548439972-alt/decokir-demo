<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דקו קיר - צביעה אומנותית ודקורציה</title>
<meta name="description" content="קחי את המכחול וצבעי את הקיר. דקו קיר, צביעה אומנותית ודקורציה, לאה פוגל.">
<meta name="robots" content="noindex">
<meta property="og:title" content="דקו קיר - קחי את המכחול וצבעי את הקיר">
<meta property="og:image" content="assets/after.jpg">
<link rel="preload" as="font" type="font/woff2" href="assets/mikhmoret-bold.woff2" crossorigin>
<link rel="preload" as="image" href="assets/before.jpg">
<link rel="preload" as="image" href="assets/after.jpg">
<style>
@font-face{font-family:'Mikhmoret';src:url(assets/mikhmoret-light.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Mikhmoret';src:url(assets/mikhmoret-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Mikhmoret';src:url(assets/mikhmoret-bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Noa Shalev';src:url(assets/noa-shalev.woff2) format('woff2');font-weight:400;font-display:swap}
:root{
  --ink:#fbf6ec;
  --gold:#d6b16a;
  --gold-deep:#b38b45;
  --brown:#3a2a1c;
  --shade:rgba(28,19,11,.78);
}
*{box-sizing:border-box;margin:0}
html{font-size:16px;background:var(--brown)}
@media (min-width:1024px){ html{font-size:calc(100vw / 90)} }
body{font-family:'Mikhmoret',system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--brown);overflow:hidden}

.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hero__img,.hero__paint{position:absolute;inset:0;width:100%;height:100%}
.hero__img{object-fit:cover;object-position:50% 38%}
.hero__paint{display:block}
@media (pointer:fine){ .hero{cursor:none} .hero a,.hero button{cursor:pointer} }

/* top bar */
.bar{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;
  padding:1.6rem 3.4vw;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,rgba(28,19,11,.55),rgba(28,19,11,0))}
.bar > *{pointer-events:auto}
.logo{display:block;width:5.4rem;height:auto;filter:drop-shadow(0 .1rem .4rem rgba(0,0,0,.35))}

/* bottom copy */
.copy{position:absolute;inset:auto 0 0 0;z-index:3;padding:9rem 3.4vw 2.6rem;pointer-events:none;
  background:linear-gradient(to top,var(--shade) 0%,rgba(28,19,11,.55) 48%,rgba(28,19,11,0) 100%)}
.copy a,.copy button{pointer-events:auto}
.kicker{font-size:1.1rem;letter-spacing:.04em;color:var(--gold);font-weight:400;margin-bottom:.5rem}
h1{font-family:'Mikhmoret',sans-serif;font-weight:700;font-size:3.9rem;line-height:1.02;max-width:42rem;text-shadow:0 .1rem 1.2rem rgba(0,0,0,.35)}
.word{position:relative;display:inline-block;font-family:'Noa Shalev',sans-serif;font-weight:400;font-size:1.12em;color:var(--gold);line-height:.9;padding-inline:.06em}
.word svg{position:absolute;inset:auto -6% -.2em -6%;width:112%;height:.5em;overflow:visible;z-index:-1}
.word path{fill:none;stroke:var(--gold-deep);stroke-width:7;stroke-linecap:round;opacity:.75;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .9s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.done{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1.4rem;
  opacity:0;transform:translateY(.8rem);visibility:hidden;transition:opacity .7s,transform .7s,visibility 0s .7s}
.done p{font-size:1.25rem;width:100%;margin-bottom:.2rem}
.hero.show-cta .done{opacity:1;transform:none;visibility:visible;transition:opacity .7s,transform .7s}
.again{background:none;border:0;color:var(--ink);font:inherit;font-size:1.1rem;text-decoration:underline;text-underline-offset:.25em;opacity:.85}

/* circle button (studio standard) */
.cbtn{--cbtn-bg:var(--gold);--cbtn-fill:var(--ink);--cbtn-ink:var(--brown);--cbtn-ink-hover:var(--brown);
  position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.85em 1.7em;border:0;border-radius:999px;background:var(--cbtn-bg);color:var(--cbtn-ink);
  font:inherit;font-size:1.15rem;font-weight:700;text-decoration:none;transition:color .45s ease}
.cbtn::before{content:"";position:absolute;z-index:-1;left:var(--x,50%);top:var(--y,50%);width:var(--d,250%);aspect-ratio:1;
  border-radius:50%;background:var(--cbtn-fill);transform:translate(-50%,-50%) scale(0);transition:transform .55s cubic-bezier(.22,.61,.36,1)}
.cbtn.is-in::before{transform:translate(-50%,-50%) scale(1)}
.cbtn.is-in{color:var(--cbtn-ink-hover)}
.cbtn--ghost{--cbtn-bg:rgba(251,246,236,.12);--cbtn-ink:var(--ink);--cbtn-fill:var(--gold);--cbtn-ink-hover:var(--brown);box-shadow:inset 0 0 0 1.5px rgba(251,246,236,.7)}
.cbtn--small{font-size:.95rem;padding:.6em 1.3em}

/* brush cursor: .brush sits exactly on the painting point */
.brush{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none;transition:opacity .25s}
.brush.off{opacity:0}
.brush__tool{position:absolute;width:3rem;height:16rem;left:-1.5rem;top:-15.4rem;
  transform-origin:50% 96.3%;transform:rotate(var(--rot,32deg));will-change:transform}
.brush__tool svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(.5rem .7rem .55rem rgba(40,25,10,.35))}
.brush.idle .brush__tool{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(var(--rot,32deg)) translateY(0)}50%{transform:rotate(calc(var(--rot,32deg) - 7deg)) translateY(-.5rem)}}

/* rotating text ring around the brush tip */
.ring{position:absolute;width:12rem;height:12rem;left:-6rem;top:-6rem;transition:opacity .6s,transform .6s}
.ring svg{width:100%;height:100%;display:block;overflow:visible;animation:spin 14s linear infinite}
.ring text{font-family:'Mikhmoret',sans-serif;font-weight:700;font-size:17px;fill:var(--brown)}
.ring .halo{fill:rgba(251,246,236,.42);stroke:rgba(179,139,69,.35);stroke-width:.8}
.ring .dot{fill:var(--gold-deep)}
.brush.painted .ring{opacity:0;transform:scale(.6)}
@keyframes spin{to{transform:rotate(-360deg)}}

@media (max-width:1023px){
  .bar{padding:16px 18px}
  .logo{width:64px}
  .copy{padding:120px 18px 26px}
  .kicker{font-size:13px}
  h1{font-size:38px;max-width:none}
  .done{margin-top:16px;gap:12px}
  .done p{font-size:16px}
  .cbtn{font-size:16px}
  .cbtn--small{font-size:14px}
  .again{font-size:15px}
  .brush__tool{width:34px;height:182px;left:-17px;top:-175.3px}
  .ring{width:150px;height:150px;left:-75px;top:-75px}
}
@media (prefers-reduced-motion:reduce){
  .cbtn::before{display:none}
  .cbtn{transition:background-color .2s,color .2s}
  .cbtn:hover,.cbtn:focus-visible{background:var(--cbtn-fill);color:var(--cbtn-ink-hover)}
  .word path{animation:none;stroke-dashoffset:0}
  .ring svg,.brush.idle .brush__tool{animation:none}
  .done,.hero.show-cta .done{transition:none}
}
</style>
</head>
<body>
<main class="hero" id="hero">
  <img class="hero__img" id="before" src="assets/before.jpg" alt="סלון עם קיר חלק לפני הצביעה">
  <canvas class="hero__paint" id="paint" aria-hidden="true"></canvas>

  <header class="bar">
    <img class="logo" src="assets/logo-cream.png" alt="דקו קיר - צביעה אומנותית ודקורציה">
    <a class="cbtn cbtn--ghost cbtn--small" href="tel:0583257497">לדבר עם לאה</a>
  </header>

  <section class="copy">
    <p class="kicker">צביעה אומנותית ודקורציה · לאה פוגל</p>
    <h1>כי בדקו קיר, אף קיר<br>הוא לא <span class="word">שבלונה<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12 C 50 4, 110 18, 196 8"/></svg></span></h1>
    <div class="done" id="done">
      <p>את הקיר הזה לאה ציירה ביד, בסלון של לקוחה.</p>
      <a class="cbtn" href="https://wa.me/972583257497?text=%D7%94%D7%99%D7%99%20%D7%9C%D7%90%D7%94%2C%20%D7%90%D7%A0%D7%99%20%D7%A8%D7%95%D7%A6%D7%94%20%D7%A7%D7%99%D7%A8%20%D7%9B%D7%96%D7%94">אני רוצה קיר כזה</a>
      <a class="cbtn cbtn--ghost" href="https://wa.me/972583257497?text=%D7%94%D7%99%D7%99%20%D7%9C%D7%90%D7%94%2C%20%D7%90%D7%A0%D7%99%20%D7%A8%D7%95%D7%A6%D7%94%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A2%D7%9C%20%D7%94%D7%A7%D7%95%D7%A8%D7%A1">אני רוצה ללמוד לצייר קירות</a>
      <button class="again" id="again" type="button">לצבוע מההתחלה</button>
    </div>
  </section>

  <div class="brush idle" id="brush" aria-hidden="true">
    <div class="ring">
      <svg viewBox="-80 -80 160 160">
        <circle class="halo" r="64"/>
        <defs><path id="ringPath" d="M 0,-52 a 52,52 0 1,1 -0.01,0"/></defs>
        <text text-anchor="middle"><textPath href="#ringPath" startOffset="50%" textLength="318" lengthAdjust="spacing">צבעי את הקיר • צבעי את הקיר •</textPath></text>
        <circle class="dot" r="3.2"/>
      </svg>
    </div>
    <div class="brush__tool">
      <!-- tip of the bristles is at (0,0); the brush stands up from it -->
      <svg viewBox="-12 -307 24 319">
        <defs>
          <linearGradient id="wood" x1="0" x2="1">
            <stop offset="0" stop-color="#2b170a"/><stop offset=".35" stop-color="#7d4a22"/><stop offset=".5" stop-color="#a5683a"/><stop offset=".75" stop-color="#5e3517"/><stop offset="1" stop-color="#26140a"/>
          </linearGradient>
          <linearGradient id="metal" x1="0" x2="1">
            <stop offset="0" stop-color="#7c6332"/><stop offset=".3" stop-color="#e9d39b"/><stop offset=".45" stop-color="#fff4cf"/><stop offset=".7" stop-color="#b8974f"/><stop offset="1" stop-color="#6d5428"/>
          </linearGradient>
          <linearGradient id="hair" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#e9d6a8"/><stop offset=".5" stop-color="#d1ae67"/><stop offset=".78" stop-color="#b8893f"/><stop offset="1" stop-color="#8f6427"/>
          </linearGradient>
          <linearGradient id="paintG" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#e7c27a"/><stop offset="1" stop-color="#a87a33"/>
          </linearGradient>
        </defs>
        <!-- handle -->
        <path d="M-5.5 -96 C -6.5 -170, -7.2 -240, -5.6 -292 C -5 -306, 5 -306, 5.6 -292 C 7.2 -240, 6.5 -170, 5.5 -96 Z" fill="url(#wood)"/>
        <path d="M-2.4 -110 C -3 -180, -3.2 -240, -2.2 -288" stroke="rgba(255,226,180,.35)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <!-- ferrule -->
        <path d="M-7.6 -50 L -6 -100 L 6 -100 L 7.6 -50 Z" fill="url(#metal)"/>
        <path d="M-7.2 -60 H 7.2 M -6.6 -66 H 6.6 M -6.1 -91 H 6.1" stroke="#7c6332" stroke-width="1.1" opacity=".75"/>
        <!-- bristles -->
        <path d="M-7.8 -50 C -9.5 -34, -8 -16, -3.2 -3 C -1.8 1, 1.8 1, 3.2 -3 C 8 -16, 9.5 -34, 7.8 -50 Z" fill="url(#hair)"/>
        <path d="M-4.5 -48 C -5 -30, -4 -16, -1.6 -5 M 0 -48 C 0 -30, 0 -15, 0 -3 M 4.5 -48 C 5 -30, 4 -16, 1.6 -5 M -6.6 -46 C -7 -32, -6 -20, -3.5 -10 M 6.6 -46 C 7 -32, 6 -20, 3.5 -10" stroke="#9a7334" stroke-width=".7" fill="none" opacity=".55"/>
        <!-- wet paint on the tip -->
        <path d="M-7.6 -24 C -6 -12, -4.5 -6, -3.2 -3 C -1.8 1, 1.8 1, 3.2 -3 C 4.5 -6, 6 -12, 7.6 -24 C 4 -20, 2 -27, 0 -22 C -2 -27, -4 -19, -7.6 -24 Z" fill="url(#paintG)"/>
        <ellipse cx="-2.2" cy="-12" rx="1" ry="3.2" fill="#fff3d4" opacity=".6"/>
      </svg>
    </div>
  </div>
</main>

<script>
(function(){
  var hero = document.getElementById('hero');
  var canvas = document.getElementById('paint');
  var ctx = canvas.getContext('2d');
  var brushEl = document.getElementById('brush');
  var tool = brushEl.querySelector('.brush__tool');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var after = new Image(); after.src = 'assets/after.jpg';
  var mask = document.createElement('canvas'), mctx = mask.getContext('2d');
  var probe = document.createElement('canvas'), pctx = probe.getContext('2d', { willReadFrequently: true });
  probe.width = 60; probe.height = 34;

  // the painted wall inside after.jpg (image pixels, 1599 x 916)
  var IMG_W = 1599, IMG_H = 916, WALL = { x: 186, y: 52, w: 1252, h: 560 };
  var POS_X = .5, POS_Y = .38;
  var CTA_AT = .55, FULL_AT = .9;

  var W = 0, H = 0, dpr = 1, cover = null, dirty = true, state = 'paint', fade = 0, last = null, bristles = [];
  var moved = false, cur = { x: 0, y: 0 }, rot = 32, rotTarget = 32;

  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    if (!W || !H) return;
    var keep = null;
    if (mask.width && mask.height) { keep = document.createElement('canvas'); keep.width = mask.width; keep.height = mask.height; keep.getContext('2d').drawImage(mask, 0, 0); }
    canvas.width = mask.width = Math.round(W * dpr);
    canvas.height = mask.height = Math.round(H * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (keep) { mctx.save(); mctx.setTransform(1,0,0,1,0,0); mctx.drawImage(keep, 0, 0, mask.width, mask.height); mctx.restore(); }
    var s = Math.max(W / IMG_W, H / IMG_H);
    var dw = IMG_W * s, dh = IMG_H * s;
    cover = { s: s, x: (W - dw) * POS_X, y: (H - dh) * POS_Y, w: dw, h: dh };
    if (!moved) park();
    dirty = true;
  }

  function wallRect(){
    return { x: cover.x + WALL.x * cover.s, y: cover.y + WALL.y * cover.s, w: WALL.w * cover.s, h: WALL.h * cover.s };
  }
  // before the first move, the brush waits in the middle of the wall
  function park(){
    var r = wallRect();
    var x = Math.min(Math.max(r.x + r.w * .5, W * .2), W * .8);
    var y = Math.min(Math.max(r.y + r.h * .42, H * .25), H * .5);
    cur.x = x; cur.y = y; place(x, y);
  }

  function radius(){ return Math.max(15, Math.min(W, H * 1.6) * 0.028); }

  function newStroke(){
    bristles = [];
    var n = 14;
    for (var i = 0; i < n; i++) bristles.push({ off: (i / (n - 1)) * 2 - 1 + (Math.random() - .5) * .14, w: .5 + Math.random() * .9, a: .3 + Math.random() * .6 });
  }

  function paintSeg(x0, y0, x1, y1){
    var dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < .5) return;
    var r = radius();
    var nx = -dy / len, ny = dx / len;
    mctx.lineCap = 'round';
    mctx.strokeStyle = 'rgba(0,0,0,.6)'; mctx.lineWidth = r * 1.3;
    mctx.beginPath(); mctx.moveTo(x0, y0); mctx.lineTo(x1, y1); mctx.stroke();
    for (var i = 0; i < bristles.length; i++){
      var b = bristles[i], ox = nx * b.off * r, oy = ny * b.off * r;
      mctx.strokeStyle = 'rgba(0,0,0,' + b.a + ')';
      mctx.lineWidth = r * .17 * b.w;
      mctx.beginPath(); mctx.moveTo(x0 + ox, y0 + oy); mctx.lineTo(x1 + ox, y1 + oy); mctx.stroke();
    }
    dirty = true;
    if (!brushEl.classList.contains('painted')) brushEl.classList.add('painted');
  }

  function place(x, y){ brushEl.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }

  function render(){
    requestAnimationFrame(render);
    if (!W || !mask.width) { if (hero.clientWidth) layout(); return; }
    // the brush leans with the movement
    rot += (rotTarget - rot) * .12; rotTarget += (32 - rotTarget) * .06;
    tool.style.setProperty('--rot', rot.toFixed(2) + 'deg');
    if (dirty && after.complete && after.naturalWidth && cover){
      dirty = false;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(mask, 0, 0);
      ctx.globalCompositeOperation = 'source-in';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(after, cover.x, cover.y, cover.w, cover.h);
      ctx.globalCompositeOperation = 'source-over';
      if (fade > 0){ ctx.globalAlpha = fade; ctx.drawImage(after, cover.x, cover.y, cover.w, cover.h); ctx.globalAlpha = 1; }
    }
  }

  function coverage(){
    if (!cover || !mask.width || !mask.height) return 0;
    var r = wallRect();
    var sx = Math.max(0, r.x), sy = Math.max(0, r.y);
    var sw = Math.min(W, r.x + r.w) - sx, sh = Math.min(H, r.y + r.h) - sy;
    if (sw <= 0 || sh <= 0) return 0;
    pctx.clearRect(0, 0, 60, 34);
    pctx.drawImage(mask, sx * dpr, sy * dpr, sw * dpr, sh * dpr, 0, 0, 60, 34);
    var d = pctx.getImageData(0, 0, 60, 34).data, hit = 0;
    for (var i = 3; i < d.length; i += 4) if (d[i] > 90) hit++;
    return hit / (60 * 34);
  }

  setInterval(function(){
    if (state === 'full') return;
    var c = coverage();
    if (c >= CTA_AT) hero.classList.add('show-cta');
    if (c >= FULL_AT) finish();
  }, 300);

  function finish(){
    state = 'full';
    if (reduce){ fade = 1; dirty = true; return; }
    var t0 = performance.now();
    (function step(t){
      fade = Math.min(1, (t - t0) / 1200); dirty = true;
      if (fade < 1) requestAnimationFrame(step);
    })(t0);
  }

  function reset(){
    state = 'paint'; fade = 0; last = null;
    mctx.save(); mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0, 0, mask.width, mask.height); mctx.restore();
    hero.classList.remove('show-cta');
    brushEl.classList.remove('painted');
    dirty = true;
  }
  document.getElementById('again').addEventListener('click', function(e){ e.stopPropagation(); reset(); });

  function local(e){ var r = hero.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onUI(e){ return e.target.closest && e.target.closest('a,button'); }

  function moveTo(p, paint){
    if (!moved){ moved = true; brushEl.classList.remove('idle'); }
    rotTarget = Math.max(12, Math.min(52, rotTarget + (p.x - cur.x) * .35));
    cur.x = p.x; cur.y = p.y; place(p.x, p.y);
    if (paint && state === 'paint'){
      if (last) paintSeg(last.x, last.y, p.x, p.y);
      last = p;
    }
  }

  var touching = false;
  hero.addEventListener('pointerdown', function(e){
    if (onUI(e)) return;
    var p = local(e);
    if (e.pointerType !== 'mouse'){ touching = true; newStroke(); last = null; brushEl.classList.remove('off'); moveTo(p, true); }
    if (state === 'paint'){ newStroke(); paintSeg(p.x, p.y, p.x + .6, p.y + .6); last = p; }
  });
  hero.addEventListener('pointermove', function(e){
    var p = local(e);
    if (onUI(e)) { brushEl.classList.add('off'); last = null; return; }
    if (e.pointerType === 'mouse'){
      brushEl.classList.remove('off');
      if (!last) newStroke();
      moveTo(p, true);
    } else if (touching){
      moveTo(p, true);
    }
  });
  function endTouch(){ touching = false; last = null; }
  hero.addEventListener('pointerup', endTouch);
  hero.addEventListener('pointercancel', endTouch);
  hero.addEventListener('pointerleave', function(e){ last = null; if (e.pointerType === 'mouse') brushEl.classList.add('off'); });
  hero.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') brushEl.classList.remove('off'); });

  window.addEventListener('resize', layout);
  layout();
  after.onload = function(){ dirty = true; };
  requestAnimationFrame(render);
})();

/* circle button: studio standard */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function place(btn, e){
    var r = btn.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var d = 2 * Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y));
    btn.style.setProperty('--x', x + 'px'); btn.style.setProperty('--y', y + 'px'); btn.style.setProperty('--d', d + 'px');
  }
  document.addEventListener('pointerover', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (!b || b.contains(e.relatedTarget)) return; place(b, e); b.classList.add('is-in'); });
  document.addEventListener('pointerout', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (!b || b.contains(e.relatedTarget)) return; place(b, e); b.classList.remove('is-in'); });
  document.addEventListener('focusin', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (b) b.classList.add('is-in'); });
  document.addEventListener('focusout', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (b) b.classList.remove('is-in'); });
})();
</script>
