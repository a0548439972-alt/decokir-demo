<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דקו קיר - צביעה אומנותית ודקורציה</title>
<meta name="description" content="קחי את המכחול וצבעי את הקיר. דקו קיר, צביעה אומנותית ודקורציה, לאה פוגל.">
<meta name="robots" content="noindex">
<meta property="og:title" content="דקו קיר - קחי את המכחול וצבעי את הקיר">
<meta property="og:image" content="assets/after.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Amatic+SC:wght@700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/before.jpg">
<link rel="preload" as="image" href="assets/after.jpg">
<style>
:root{
  --ink:#fbf6ec;
  --gold:#d6b16a;
  --gold-deep:#b38b45;
  --brown:#3a2a1c;
  --shade:rgba(28,19,11,.78);
}
*{box-sizing:border-box;margin:0}
html{font-size:16px;background:var(--brown)}
@media (min-width:1024px){ html{font-size:calc(100vw / 90)} }
body{font-family:'Assistant',system-ui,sans-serif;color:var(--ink);background:var(--brown);overflow:hidden}

.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hero__img,.hero__paint{position:absolute;inset:0;width:100%;height:100%}
.hero__img{object-fit:cover;object-position:50% 38%;filter:saturate(.92)}
.hero__paint{display:block}
@media (pointer:fine){ .hero.can-paint{cursor:none} }

/* top bar */
.bar{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;
  padding:1.6rem 3.4vw;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,rgba(28,19,11,.55),rgba(28,19,11,0))}
.bar > *{pointer-events:auto}
.logo{display:block;width:5.4rem;height:auto;filter:drop-shadow(0 .1rem .4rem rgba(0,0,0,.35))}

/* bottom copy */
.copy{position:absolute;inset:auto 0 0 0;z-index:3;padding:9rem 3.4vw 2.6rem;pointer-events:none;
  background:linear-gradient(to top,var(--shade) 0%,rgba(28,19,11,.55) 48%,rgba(28,19,11,0) 100%)}
.copy > *{pointer-events:auto}
.kicker{font-size:1rem;letter-spacing:.06em;color:var(--gold);font-weight:600;margin-bottom:.5rem}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:3.6rem;line-height:1.08;max-width:42rem;text-shadow:0 .1rem 1.2rem rgba(0,0,0,.35)}
.word{position:relative;display:inline-block;font-family:'Amatic SC',cursive;font-weight:700;font-size:1.32em;color:var(--gold);line-height:.8;padding-inline:.06em}
.word svg{position:absolute;inset:auto -6% -.2em -6%;width:112%;height:.5em;overflow:visible;z-index:-1}
.word path{fill:none;stroke:var(--gold-deep);stroke-width:7;stroke-linecap:round;opacity:.75;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .9s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.row{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:1.4rem;min-height:3.4rem}
.hint{display:flex;align-items:center;gap:.7rem;font-size:1.25rem;font-weight:600}
.hint svg{width:2.1rem;height:2.1rem;flex:none;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-.35rem,-.15rem) rotate(-10deg)}}
.meter{width:9rem;height:.3rem;border-radius:1rem;background:rgba(251,246,236,.25);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.done{display:none;flex-wrap:wrap;align-items:center;gap:1rem}
.done p{font-size:1.2rem;width:100%;margin-bottom:.2rem}
.hero.is-done .hint,.hero.is-done .meter{display:none}
.hero.is-done .done{display:flex;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
.again{background:none;border:0;color:var(--ink);font:inherit;font-size:1.05rem;text-decoration:underline;text-underline-offset:.25em;cursor:pointer;opacity:.85}

/* circle button (studio standard) */
.cbtn{--cbtn-bg:var(--gold);--cbtn-fill:var(--ink);--cbtn-ink:var(--brown);--cbtn-ink-hover:var(--brown);
  position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.85em 1.7em;border:0;border-radius:999px;cursor:pointer;background:var(--cbtn-bg);color:var(--cbtn-ink);
  font:inherit;font-size:1.1rem;font-weight:600;text-decoration:none;transition:color .45s ease}
.cbtn::before{content:"";position:absolute;z-index:-1;left:var(--x,50%);top:var(--y,50%);width:var(--d,250%);aspect-ratio:1;
  border-radius:50%;background:var(--cbtn-fill);transform:translate(-50%,-50%) scale(0);transition:transform .55s cubic-bezier(.22,.61,.36,1)}
.cbtn.is-in::before{transform:translate(-50%,-50%) scale(1)}
.cbtn.is-in{color:var(--cbtn-ink-hover)}
.cbtn--ghost{--cbtn-bg:rgba(251,246,236,.12);--cbtn-ink:var(--ink);--cbtn-fill:var(--gold);--cbtn-ink-hover:var(--brown);box-shadow:inset 0 0 0 1.5px rgba(251,246,236,.7)}
.cbtn--small{font-size:.95rem;padding:.6em 1.3em}

/* brush cursor */
.brush{position:absolute;left:0;top:0;width:4.6rem;height:4.6rem;z-index:4;pointer-events:none;opacity:0;
  transform:translate(-9%,-91%);transition:opacity .25s;will-change:left,top}
.brush.on{opacity:1}
.brush svg{width:100%;height:100%;display:block;filter:drop-shadow(.15rem .3rem .35rem rgba(0,0,0,.35))}

@media (max-width:1023px){
  .bar{padding:16px 18px}
  .logo{width:64px}
  .copy{padding:120px 18px 26px}
  .kicker{font-size:13px}
  h1{font-size:34px;max-width:none}
  .row{margin-top:16px;gap:14px}
  .hint{font-size:17px}
  .hint svg{width:28px;height:28px}
  .meter{width:110px}
  .done p{font-size:16px}
  .cbtn{font-size:16px}
  .cbtn--small{font-size:14px}
  .brush{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){
  .cbtn::before{display:none}
  .cbtn{transition:background-color .2s,color .2s}
  .cbtn:hover,.cbtn:focus-visible{background:var(--cbtn-fill);color:var(--cbtn-ink-hover)}
  .word path{animation:none;stroke-dashoffset:0}
  .hint svg{animation:none}
  .hero.is-done .done{animation:none}
}
</style>
</head>
<body>
<main class="hero" id="hero">
  <img class="hero__img" id="before" src="assets/before.jpg" alt="סלון עם קיר חלק לפני הצביעה">
  <canvas class="hero__paint" id="paint" aria-hidden="true"></canvas>

  <header class="bar">
    <img class="logo" src="assets/logo-cream.png" alt="דקו קיר - צביעה אומנותית ודקורציה">
    <a class="cbtn cbtn--ghost cbtn--small" href="tel:0583257497">לדבר עם לאה</a>
  </header>

  <section class="copy">
    <p class="kicker">צביעה אומנותית ודקורציה · לאה פוגל</p>
    <h1>כי בדקו קיר, אף קיר<br>הוא לא <span class="word">שבלונה<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12 C 50 4, 110 18, 196 8"/></svg></span></h1>
    <div class="row">
      <p class="hint" id="hint">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#brush-icon"/></svg>
        <span id="hintText">קחי את המכחול וצבעי את הקיר</span>
      </p>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <div class="done" id="done">
        <p>את הקיר הזה לאה ציירה ביד, בסלון של לקוחה.</p>
        <a class="cbtn" href="https://wa.me/972583257497?text=%D7%94%D7%99%D7%99%20%D7%9C%D7%90%D7%94%2C%20%D7%90%D7%A0%D7%99%20%D7%A8%D7%95%D7%A6%D7%94%20%D7%A7%D7%99%D7%A8%20%D7%9B%D7%96%D7%94">אני רוצה קיר כזה</a>
        <a class="cbtn cbtn--ghost" href="https://wa.me/972583257497?text=%D7%94%D7%99%D7%99%20%D7%9C%D7%90%D7%94%2C%20%D7%90%D7%A0%D7%99%20%D7%A8%D7%95%D7%A6%D7%94%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A2%D7%9C%20%D7%94%D7%A7%D7%95%D7%A8%D7%A1">אני רוצה ללמוד לצייר קירות</a>
        <button class="again" id="again" type="button">לצבוע שוב</button>
      </div>
    </div>
  </section>

  <div class="brush" id="brush" aria-hidden="true">
    <svg viewBox="0 0 64 64"><use href="#brush-icon"/></svg>
  </div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="brush-icon" viewBox="0 0 64 64">
    <!-- handle -->
    <path d="M60 4 C 57 3, 54 5, 52 7 L 31 30 L 36 35 L 58 12 C 61 9, 62 6, 60 4 Z" fill="#6b4a2b"/>
    <path d="M58 6 C 56 6, 54 8, 53 9" stroke="#9c7349" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- ferrule -->
    <path d="M27 30 L 32 25 L 41 34 L 36 39 Z" fill="#d9c08a"/>
    <path d="M28.5 31.5 L 33.5 26.5 M31 34 L 36 29" stroke="#a88a52" stroke-width="1.2"/>
    <!-- bristles with gold paint -->
    <path d="M27 30 L 36 39 C 32 45, 22 52, 8 58 C 6 59, 5 58, 6 56 C 12 42, 19 34, 27 30 Z" fill="#c9a35c"/>
    <path d="M14 50 C 18 44, 22 39, 27 35 M10 55 C 15 47, 20 41, 24 37" stroke="#a7823f" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M8 58 C 6 59, 5 58, 6 56 C 7 54, 9 53, 10 54 C 11 56, 10 57, 8 58 Z" fill="#e6c98a"/>
  </symbol>
</svg>

<script>
(function(){
  var hero = document.getElementById('hero');
  var canvas = document.getElementById('paint');
  var ctx = canvas.getContext('2d');
  var brushEl = document.getElementById('brush');
  var meter = document.getElementById('meter');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = matchMedia('(pointer: fine)').matches;

  var after = new Image(); after.src = 'assets/after.jpg';
  var mask = document.createElement('canvas'), mctx = mask.getContext('2d');
  var probe = document.createElement('canvas'), pctx = probe.getContext('2d', { willReadFrequently: true });
  probe.width = 60; probe.height = 34;

  // the painted wall inside after.jpg (image pixels, 1599 x 916)
  var IMG_W = 1599, IMG_H = 916, WALL = { x: 186, y: 52, w: 1252, h: 560 };
  var POS_X = .5, POS_Y = .38;

  var W = 0, H = 0, dpr = 1, cover = null, dirty = true, done = false, fade = 0, last = null, bristles = [];

  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    if (!W || !H) return;
    var keep = null;
    if (mask.width && mask.height) { keep = document.createElement('canvas'); keep.width = mask.width; keep.height = mask.height; keep.getContext('2d').drawImage(mask, 0, 0); }
    canvas.width = mask.width = Math.round(W * dpr);
    canvas.height = mask.height = Math.round(H * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (keep) { mctx.save(); mctx.setTransform(1,0,0,1,0,0); mctx.drawImage(keep, 0, 0, mask.width, mask.height); mctx.restore(); }
    var s = Math.max(W / IMG_W, H / IMG_H);
    var dw = IMG_W * s, dh = IMG_H * s;
    cover = { s: s, x: (W - dw) * POS_X, y: (H - dh) * POS_Y, w: dw, h: dh };
    dirty = true;
  }

  function radius(){ return Math.max(26, Math.min(W, H * 1.6) * 0.045); }

  function newStroke(){
    bristles = [];
    var n = 16;
    for (var i = 0; i < n; i++) bristles.push({ off: (i / (n - 1)) * 2 - 1 + (Math.random() - .5) * .12, w: .5 + Math.random() * .9, a: .35 + Math.random() * .55 });
  }

  function paintSeg(x0, y0, x1, y1){
    var dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < .5) return;
    var r = radius();
    var nx = -dy / len, ny = dx / len;
    mctx.lineCap = 'round';
    // soft body
    mctx.strokeStyle = 'rgba(0,0,0,.55)'; mctx.lineWidth = r * 1.35;
    mctx.beginPath(); mctx.moveTo(x0, y0); mctx.lineTo(x1, y1); mctx.stroke();
    // bristle streaks
    for (var i = 0; i < bristles.length; i++){
      var b = bristles[i], ox = nx * b.off * r, oy = ny * b.off * r;
      mctx.strokeStyle = 'rgba(0,0,0,' + b.a + ')';
      mctx.lineWidth = r * .16 * b.w;
      mctx.beginPath(); mctx.moveTo(x0 + ox, y0 + oy); mctx.lineTo(x1 + ox, y1 + oy); mctx.stroke();
    }
    dirty = true;
  }

  function moveBrush(x, y){ brushEl.style.left = x + 'px'; brushEl.style.top = y + 'px'; }

  function render(){
    requestAnimationFrame(render);
    if (!mask.width || !mask.height || !W) { if (hero.clientWidth) layout(); return; }
    if (dirty && after.complete && after.naturalWidth && cover){
      dirty = false;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(mask, 0, 0);
      ctx.globalCompositeOperation = 'source-in';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(after, cover.x, cover.y, cover.w, cover.h);
      ctx.globalCompositeOperation = 'source-over';
      if (fade > 0){ ctx.globalAlpha = fade; ctx.drawImage(after, cover.x, cover.y, cover.w, cover.h); ctx.globalAlpha = 1; }
    }
  }

  // how much of the wall is painted
  function coverage(){
    if (!cover || !mask.width || !mask.height) return 0;
    var wx = cover.x + WALL.x * cover.s, wy = cover.y + WALL.y * cover.s;
    var ww = WALL.w * cover.s, wh = WALL.h * cover.s;
    var sx = Math.max(0, wx), sy = Math.max(0, wy);
    var sw = Math.min(W, wx + ww) - sx, sh = Math.min(H, wy + wh) - sy;
    if (sw <= 0 || sh <= 0) return 0;
    pctx.clearRect(0, 0, 60, 34);
    pctx.drawImage(mask, sx * dpr, sy * dpr, sw * dpr, sh * dpr, 0, 0, 60, 34);
    var d = pctx.getImageData(0, 0, 60, 34).data, hit = 0;
    for (var i = 3; i < d.length; i += 4) if (d[i] > 90) hit++;
    return hit / (60 * 34);
  }

  var THRESHOLD = .42;
  setInterval(function(){
    if (done) return;
    var c = coverage();
    meter.style.width = Math.min(100, c / THRESHOLD * 100) + '%';
    if (c >= THRESHOLD) finish();
  }, 300);

  function finish(){
    done = true;
    hero.classList.add('is-done');
    brushEl.classList.remove('on');
    hero.classList.remove('can-paint');
    if (reduce){ fade = 1; dirty = true; return; }
    var t0 = performance.now();
    (function step(t){
      fade = Math.min(1, (t - t0) / 1400); dirty = true;
      if (fade < 1) requestAnimationFrame(step);
    })(t0);
  }

  function reset(){
    done = false; fade = 0; last = null;
    mctx.save(); mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0, 0, mask.width, mask.height); mctx.restore();
    meter.style.width = '0';
    hero.classList.remove('is-done');
    hero.classList.add('can-paint');
    dirty = true;
  }
  document.getElementById('again').addEventListener('click', function(e){ e.stopPropagation(); reset(); if (!reduce) intro(); });

  function local(e){ var r = hero.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onUI(e){ return e.target.closest && e.target.closest('a,button'); }

  var touching = false, introRunning = false;
  hero.addEventListener('pointerdown', function(e){
    if (done || onUI(e)) return;
    introRunning = false;
    touching = true; newStroke(); last = local(e);
    if (e.pointerType !== 'mouse') { moveBrush(last.x, last.y); brushEl.classList.add('on'); }
    paintSeg(last.x, last.y, last.x + .6, last.y + .6);
  });
  hero.addEventListener('pointermove', function(e){
    if (done) return;
    var p = local(e);
    if (onUI(e)) { brushEl.classList.remove('on'); last = null; return; }
    var isMouse = e.pointerType === 'mouse';
    if (isMouse){
      introRunning = false;
      brushEl.classList.add('on'); moveBrush(p.x, p.y);
      if (!last) newStroke();
      if (last) paintSeg(last.x, last.y, p.x, p.y);
      last = p;
    } else if (touching){
      moveBrush(p.x, p.y);
      if (last) paintSeg(last.x, last.y, p.x, p.y);
      last = p;
    }
  });
  function endTouch(){ touching = false; last = null; if (!finePointer) brushEl.classList.remove('on'); }
  hero.addEventListener('pointerup', endTouch);
  hero.addEventListener('pointercancel', endTouch);
  hero.addEventListener('pointerleave', function(){ last = null; brushEl.classList.remove('on'); });

  // a first stroke that shows what to do
  function intro(){
    if (!cover || !mask.width) { setTimeout(intro, 300); return; }
    introRunning = true; newStroke();
    var wx = cover.x + WALL.x * cover.s, wy = cover.y + WALL.y * cover.s, ww = WALL.w * cover.s, wh = WALL.h * cover.s;
    var x0 = Math.max(W * .12, wx + ww * .12), x1 = Math.min(W * .88, wx + ww * .88);
    var yMid = Math.max(H * .22, Math.min(H * .45, wy + wh * .38)), amp = Math.min(H * .07, wh * .16);
    var t0 = performance.now(), dur = 1700, prev = null;
    brushEl.classList.add('on');
    (function step(t){
      if (!introRunning){ return; }
      var k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      var x = x1 + (x0 - x1) * e, y = yMid + Math.sin(e * Math.PI * 2) * amp;
      moveBrush(x, y);
      if (prev) paintSeg(prev.x, prev.y, x, y);
      prev = { x: x, y: y };
      if (k < 1) requestAnimationFrame(step);
      else { introRunning = false; brushEl.classList.remove('on'); }
    })(t0);
  }

  window.addEventListener('resize', layout);
  layout();
  hero.classList.add('can-paint');
  after.onload = function(){ dirty = true; if (!reduce) setTimeout(intro, 700); };
  if (after.complete) after.onload();
  requestAnimationFrame(render);
})();

/* circle button: studio standard */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function place(btn, e){
    var r = btn.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var d = 2 * Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y));
    btn.style.setProperty('--x', x + 'px'); btn.style.setProperty('--y', y + 'px'); btn.style.setProperty('--d', d + 'px');
  }
  document.addEventListener('pointerover', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (!b || b.contains(e.relatedTarget)) return; place(b, e); b.classList.add('is-in'); });
  document.addEventListener('pointerout', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (!b || b.contains(e.relatedTarget)) return; place(b, e); b.classList.remove('is-in'); });
  document.addEventListener('focusin', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (b) b.classList.add('is-in'); });
  document.addEventListener('focusout', function(e){ var b = e.target.closest && e.target.closest('.cbtn'); if (b) b.classList.remove('is-in'); });
})();
</script>
</body>
</html>
